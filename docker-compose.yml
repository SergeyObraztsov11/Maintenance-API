services:
    db:
        image: postgres:16-alpine
        env_file:
            - .env
        environment:
            POSTGRES_DB: ${DB_NAME}
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        ports:
            - "${DB_PORT}:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
            interval: 5s
            timeout: 5s
            retries: 10
        restart: unless-stopped
    api:
        build: .
        ports:
            - "3000:3000"
        env_file:
            - .env
        environment:
            DB_HOST: db
        volumes:
            - ./data:/app/data
        depends_on:
            db:
                condition: service_healthy
        restart: unless-stopped
volumes:
    pgdata:
