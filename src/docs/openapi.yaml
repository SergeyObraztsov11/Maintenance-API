          description: Forbidden (role or not assigned)
          content:
            application/json:
              examples:
                role:
                  summary: Insufficient permissions
                  value:
                    error:
                      code: FORBIDDEN
                      message: Insufficient permissions
                      details: []
                      requestId: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                notAssignee:
                  summary: Technician not assigned
                  value:
                    error:
