  /metrics:
    get:
      tags:
        - Metrics
      summary: Prometheus metrics
      description: |
        Public on the API process. Behind Nginx in Docker this path returns 403;
        Prometheus scrapes api:3000 on the internal network.
      responses:
        "200":
          description: Prometheus text format
          content:
            text/plain:
              example: |
                # HELP http_request_total Total number of HTTP requests
                # TYPE http_request_total counter
                http_request_total{method="GET",route="/api/health/live",status_code="200"} 3
        "403":
          description: Blocked by Nginx reverse proxy
          content:
            text/html:
              example: |
                <html><head><title>403 Forbidden</title></head><body><h1>403 Forbidden</h1></body></html>
        "500":
          $ref: "#/components/responses/InternalError"
