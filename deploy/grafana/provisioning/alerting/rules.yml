apiVersion: 1

groups:
  - orgId: 1
    name: maintenance-api
    folder: Maintenance
    interval: 30s
    rules:
      - uid: api-down
        title: API unavailable
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: max(up{job=~"maintenance-api.*"})
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query
        noDataState: Alerting
        execErrState: Alerting
        for: 30s
        annotations:
          summary: Maintenance API is down or unreachable from Prometheus
          description: Check npm run dev / docker api, then Prometheus targets and /metrics
        labels:
          severity: critical

      - uid: high-5xx
        title: High 5xx error rate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: >
                sum(rate(http_request_total{status_code=~"5.."}[5m]))
                /
                clamp_min(sum(rate(http_request_total[5m])), 1e-9)
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0.05]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query
        noDataState: OK
        execErrState: Alerting
        for: 2m
        annotations:
          summary: More than 5% of HTTP responses are 5xx
          description: Check API logs, /health/ready, database connectivity, and recent deploys
        labels:
          severity: warning

      - uid: overdue-requests
        title: Too many overdue planned requests
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: postgres
            model:
              datasource:
                type: postgres
                uid: postgres
              editorType: code
              format: table
              rawQuery: true
              rawSql: >
                SELECT COUNT(*)::float AS overdue
                FROM maintenance_requests
                WHERE planned_at < NOW()
                  AND status NOT IN ('done', 'rejected');
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params: [10]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query
        noDataState: OK
        execErrState: Alerting
        for: 1m
        annotations:
          summary: More than 10 planned maintenance requests are overdue
          description: Open Business Metrics dashboard and review requests with planned_at in the past
        labels:
          severity: warning
